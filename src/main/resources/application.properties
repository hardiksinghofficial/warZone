server.port=${PORT:8080}

# ============================================
# Neon PostgreSQL
# ============================================
spring.datasource.url=jdbc:postgresql://ep-royal-hall-ahkq0nj8-pooler.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_E5nZQOVR4GMx
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.warzone=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ACLED is the gold standard for conflict data - free API
app.acled.base-url=https://api.acleddata.com/acled/read
app.acled.api-key=${ACLED_API_KEY:}
app.acled.email=${ACLED_EMAIL:}

# GDELT as backup source
app.gdelt.base-url=https://api.gdeltproject.org/api/v2/doc/doc

# polling intervals
app.conflict.poll-interval=900000
app.news.poll-interval=600000
app.risk.calc-interval=300000
